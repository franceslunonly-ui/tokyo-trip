<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🗼 东京行程单 | Tokyo Trip</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
  :root{--cherry:#E8719E;--cherry-light:#FFF0F5;--cherry-dark:#C4537A;--ink:#2D2D2D;--ink-light:#666;--bg:#FAFAF8;--card:#FFF;--border:#F0E8E0;--shadow:0 1px 8px rgba(0,0,0,.05)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;padding-bottom:60px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}

  /* Hero - 更紧凑 */
  .hero{background:linear-gradient(135deg,#E8719E 0%,#F4A5C0 40%,#FFD4E5 100%);padding:40px 16px 32px;text-align:center;position:relative;overflow:hidden}
  .hero::before{content:'🌸';position:absolute;font-size:100px;opacity:.12;top:-15px;right:-5px;transform:rotate(15deg)}
  .hero::after{content:'🗼';position:absolute;font-size:65px;opacity:.12;bottom:-8px;left:8px;transform:rotate(-10deg)}
  .hero h1{font-size:1.8em;font-weight:700;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.15);margin-bottom:4px}
  .hero .subtitle{color:rgba(255,255,255,.9);font-size:.88em;font-weight:300}
  .hero .dates{display:inline-block;margin-top:10px;background:rgba(255,255,255,.25);backdrop-filter:blur(10px);padding:5px 16px;border-radius:20px;color:#fff;font-size:.82em;font-weight:500}

  .container{max-width:800px;margin:0 auto;padding:0 12px}

  /* Checklist - 更紧凑 */
  .checklist{background:var(--card);border-radius:14px;box-shadow:var(--shadow);margin:-16px auto 16px;position:relative;z-index:2;padding:16px 18px;max-width:800px}
  .checklist h2{font-size:1em;color:var(--cherry-dark);margin-bottom:10px}
  .checklist ul{list-style:none}
  .checklist li{padding:6px 0;border-bottom:1px dashed var(--border);font-size:.85em;display:flex;align-items:flex-start;gap:8px;cursor:pointer;user-select:none;-webkit-user-select:none}
  .checklist li:last-child{border-bottom:none}
  .checklist li::before{content:'☐';font-size:1em;flex-shrink:0}
  .checklist li.checked::before{content:'☑';color:#5BA37A}
  .checklist a{color:#4A90D9;text-decoration:none;border-bottom:1px dotted #4A90D9}

  /* Day Nav - 手机优化 */
  .day-nav{display:flex;gap:6px;justify-content:center;padding:10px 8px;position:sticky;top:0;z-index:100;background:rgba(250,250,248,.92);backdrop-filter:blur(12px);max-width:832px;margin:0 auto;flex-wrap:wrap}
  .day-nav a{padding:6px 16px;border-radius:18px;background:var(--card);color:var(--ink);text-decoration:none;font-size:.8em;font-weight:500;box-shadow:0 1px 4px rgba(0,0,0,.08);transition:all .2s;white-space:nowrap;-webkit-tap-highlight-color:transparent}
  .day-nav a:hover,.day-nav a.active{background:var(--cherry);color:#fff;transform:translateY(-1px);box-shadow:0 3px 10px rgba(232,113,158,.3)}

  /* Day Section - 更紧凑 */
  .day-section{margin:16px 0}
  .day-header{display:flex;align-items:center;gap:12px;padding:0 4px;margin-bottom:12px;max-width:800px;margin-left:auto;margin-right:auto}
  .day-number{width:46px;height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .day-number .d{font-size:1.3em;line-height:1}.day-number .m{font-size:.55em;font-weight:400;opacity:.9}
  .day-info h2{font-size:1.1em;font-weight:700}.day-info .weekday{font-size:.78em;color:var(--ink-light)}

  /* Timeline - 更紧凑 */
  .timeline{position:relative;padding-left:32px;max-width:800px;margin:0 auto}
  .timeline::before{content:'';position:absolute;left:15px;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(--border),transparent)}
  .tl-item{position:relative;margin-bottom:10px}
  .tl-dot{position:absolute;left:-22px;top:14px;width:10px;height:10px;border-radius:50%;border:2.5px solid var(--cherry-light);z-index:1}
  .tl-card{background:var(--card);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
  .time-badge{display:inline-block;padding:1px 8px;border-radius:8px;font-size:.72em;font-weight:600;margin-bottom:5px}
  .tl-card .act{font-weight:500;font-size:.88em;margin-bottom:4px;line-height:1.55}
  .tl-card a{color:#4A90D9;text-decoration:none;border-bottom:1px dotted #4A90D9}

  /* Food & Note - 更紧凑 */
  .food,.note{margin-top:8px;padding:8px 10px;border-radius:8px;font-size:.8em;line-height:1.7}
  .food{background:#FFF9F0;border-left:3px solid #E8913A}
  .food .fl{font-weight:600;color:#E8913A;margin-bottom:2px}
  .note{background:#F0F5FF;border-left:3px solid #4A90D9}
  .food a,.note a{color:#4A90D9;text-decoration:none;border-bottom:1px dotted}

  /* Spots - 更紧凑 */
  .spots{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:4px 0}
  .spots .s{background:#F8F4FF;padding:3px 10px;border-radius:7px;font-size:.76em;font-weight:500;color:#8B6FB0;white-space:nowrap}
  .spots .ar{color:#ccc;font-size:.75em}

  /* ===== 详情展开（图片+介绍）===== */
  .detail-toggle{display:inline-flex;align-items:center;gap:3px;margin-left:6px;padding:1px 8px;border-radius:6px;background:#FFF0F5;color:var(--cherry);font-size:.7em;font-weight:500;cursor:pointer;border:1px solid #F5D5E0;transition:all .2s;-webkit-tap-highlight-color:transparent;vertical-align:middle}
  .detail-toggle:active{transform:scale(.95)}
  .detail-toggle .arrow{transition:transform .2s;display:inline-block}
  .detail-toggle.open .arrow{transform:rotate(90deg)}
  .detail-box{display:none;margin-top:8px;padding:10px 12px;border-radius:10px;background:linear-gradient(135deg,#FFF8FB,#FFF0F5);border:1px solid #F5D5E0;font-size:.82em;line-height:1.65;color:var(--ink)}
  .detail-box.open{display:block;animation:fadeIn .25s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
  .detail-box img{width:100%;border-radius:8px;margin:8px 0 4px;display:block;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  .detail-box p{margin:4px 0}
  .xhs-card{display:flex;align-items:center;gap:10px;margin:8px 0;padding:10px 14px;border-radius:10px;background:#fff;border:1px solid #FFE0E0;cursor:pointer;text-decoration:none;color:var(--ink);transition:all .2s;-webkit-tap-highlight-color:transparent}
  .xhs-card:active{transform:scale(.98);background:#FFF5F5}
  .xhs-card .xhs-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;color:#fff;font-weight:700}
  .xhs-card .xhs-info{flex:1;min-width:0}
  .xhs-card .xhs-title{font-size:.82em;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .xhs-card .xhs-source{font-size:.68em;color:var(--ink-light);margin-top:2px}
  .xhs-toast{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:10000;justify-content:center;align-items:center;backdrop-filter:blur(3px)}
  .xhs-toast.open{display:flex}
  .xhs-toast-box{background:#fff;border-radius:16px;padding:24px 20px;max-width:340px;width:90%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.2);animation:fadeIn .2s ease}
  .xhs-toast-box .xhs-t-icon{font-size:36px;margin-bottom:10px}
  .xhs-toast-box .xhs-t-title{font-size:.95em;font-weight:700;margin-bottom:6px;line-height:1.4}
  .xhs-toast-box .xhs-t-desc{font-size:.78em;color:var(--ink-light);margin-bottom:16px;line-height:1.5}
  .xhs-toast-box .xhs-t-btns{display:flex;gap:8px}
  .xhs-toast-box .xhs-t-btn{flex:1;padding:10px 0;border-radius:10px;border:none;font-size:.85em;font-weight:600;cursor:pointer}
  .xhs-toast-box .xhs-t-copy{background:linear-gradient(135deg,#FF4458,#FF2442);color:#fff}
  .xhs-toast-box .xhs-t-cancel{background:#f5f5f5;color:var(--ink-light)}
  .xhs-toast-box .xhs-t-ok{display:none;color:#5BA37A;font-size:.82em;font-weight:600;margin-top:10px}
  .xhs-card .xhs-arrow{color:#ccc;font-size:.9em;flex-shrink:0}

  /* ===== 地图弹窗 ===== */
  .map-link{color:var(--cherry);text-decoration:none;border-bottom:2px solid var(--cherry);cursor:pointer;font-weight:600;transition:all .2s;-webkit-tap-highlight-color:transparent}
  .map-link:active{background:var(--cherry-light);border-radius:2px}
  .map-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:9999;justify-content:center;align-items:flex-end;backdrop-filter:blur(3px)}
  .map-overlay.open{display:flex}
  .map-panel{width:100%;max-width:800px;height:55vh;background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -4px 30px rgba(0,0,0,.2);display:flex;flex-direction:column;overflow:hidden;animation:slideUp .3s ease}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .map-panel-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
  .map-panel-header .place-name{font-weight:700;font-size:.95em}
  .map-panel-header .close-btn{width:30px;height:30px;border-radius:50%;border:none;background:#f0f0f0;font-size:1em;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
  .map-panel iframe{flex:1;border:none;width:100%}
  .map-panel .map-footer{padding:8px 16px;text-align:center;border-top:1px solid var(--border)}
  .map-panel .map-footer a{color:#4A90D9;text-decoration:none;font-size:.82em;font-weight:500}

  .footer{text-align:center;padding:30px 16px;color:var(--ink-light);font-size:.78em}
  .footer .emoji{font-size:1.6em;margin-bottom:6px}

  /* ===== 手机端深度优化 ===== */
  @media(max-width:600px){
    .hero{padding:32px 14px 26px}
    .hero h1{font-size:1.55em}
    .hero .subtitle{font-size:.82em}
    .hero .dates{font-size:.78em;padding:4px 14px}
    .container{padding:0 10px}
    .checklist{margin:-14px 6px 12px;padding:14px 14px}
    .checklist li{font-size:.83em;padding:5px 0;gap:6px}
    .day-nav{padding:8px 6px;gap:5px}
    .day-nav a{padding:5px 13px;font-size:.78em}
    .day-section{margin:12px 0}
    .day-header{gap:10px;padding:0 2px;margin-bottom:10px}
    .day-number{width:42px;height:42px;border-radius:10px}
    .day-number .d{font-size:1.2em}
    .day-info h2{font-size:1em}
    .day-info .weekday{font-size:.75em}
    .timeline{padding-left:28px}
    .timeline::before{left:13px}
    .tl-item{margin-bottom:8px}
    .tl-dot{left:-20px;top:12px;width:9px;height:9px;border-width:2px}
    .tl-card{padding:10px 12px;border-radius:10px}
    .time-badge{font-size:.7em;padding:1px 7px}
    .tl-card .act{font-size:.84em;line-height:1.5;margin-bottom:3px}
    .food,.note{padding:7px 9px;font-size:.78em;line-height:1.6;margin-top:6px}
    .spots{gap:3px;margin:3px 0}
    .spots .s{padding:2px 8px;font-size:.73em;border-radius:6px}
    .spots .ar{font-size:.7em}
    .detail-box{font-size:.8em;padding:8px 10px}
    .map-panel{height:50vh;border-radius:16px 16px 0 0}
    .map-panel-header{padding:12px 14px}
    .map-panel-header .place-name{font-size:.9em}
    .footer{padding:24px 14px}
  }

  /* 极小屏幕 */
  @media(max-width:375px){
    .hero h1{font-size:1.4em}
    .tl-card .act{font-size:.82em}
    .day-nav a{padding:5px 11px;font-size:.75em}
  }

  /* 安全区域适配（iPhone刘海/底部横条）*/
  @supports(padding:max(0px)){
    body{padding-bottom:max(60px,env(safe-area-inset-bottom))}
    .day-nav{padding-top:max(10px,env(safe-area-inset-top))}
    .map-panel .map-footer{padding-bottom:max(8px,env(safe-area-inset-bottom))}
  }

  @media print{.day-nav{display:none}.tl-card{break-inside:avoid}}
</style>
</head>
<body>
<div id="app"></div>

<!-- 地图弹窗容器 -->
<div class="xhs-toast" id="xhsToast" onclick="if(event.target===this)closeXhs()">
  <div class="xhs-toast-box">
    <div class="xhs-t-icon">📕</div>
    <div class="xhs-t-title" id="xhsTitle"></div>
    <div class="xhs-t-desc">点击复制后打开小红书App，允许粘贴即可跳转笔记</div>
    <div class="xhs-t-btns">
      <button class="xhs-t-btn xhs-t-cancel" onclick="closeXhs()">关闭</button>
      <button class="xhs-t-btn xhs-t-copy" onclick="copyXhs()">📋 复制口令</button>
    </div>
    <div class="xhs-t-ok" id="xhsOk">✅ 已复制！打开小红书App，允许粘贴即可跳转</div>
  </div>
</div>

<div class="map-overlay" id="mapOverlay" onclick="if(event.target===this)closeMap()">
  <div class="map-panel">
    <div class="map-panel-header">
      <span class="place-name" id="mapTitle">📍</span>
      <button class="close-btn" onclick="closeMap()">✕</button>
    </div>
    <iframe id="mapFrame" src="" allow="geolocation"></iframe>
    <div class="map-footer">
      <a id="mapFullLink" href="" target="_blank">🗺️ 在谷歌地图中打开 →</a>
    </div>
  </div>
</div>

<script>
/*
╔══════════════════════════════════════════════════════════════╗
║                                                              ║
║          ✏️ 修改行程？只需要改下面这个 DATA 部分！            ║
║                                                              ║
║   📌 修改规则（超简单）：                                     ║
║                                                              ║
║   1. 文字直接改就行                                           ║
║   2. 想加粗：用 **两个星号包起来**                             ║
║   3. 想加链接：用 [显示文字](网址)                             ║
║   4. 想加新的一项：复制一个 { } 块，改里面内容                  ║
║   5. 想删除一项：把那个 { } 块整个删掉                         ║
║   6. spots 是景点连线，用逗号隔开                              ║
║   7. food 是美食推荐，用 / 隔开多个选项                        ║
║   8. note 是备注信息                                          ║
║                                                              ║
║   🆕 9. 想给地点加地图弹窗（粉色下划线，点击弹出地图）：       ║
║      用 {{显示文字|地点}} 的格式                               ║
║      方法A — 谷歌地图链接 → 点击直接打开地图App               ║
║      方法B — 英文地名 → 点击弹出半屏地图预览                  ║
║      方法C — 经纬度坐标 → 点击弹出半屏地图预览                ║
║                                                              ║
║   🆕 10. 想给景点加介绍和图片（点击展开）：                    ║
║      在 { } 里加一行 detail，格式如下：                        ║
║      detail: "介绍文字 !!图片网址!! 更多文字"                  ║
║      图片用 !! 两个感叹号包起来，可以插入多张                  ║
║                                                              ║
║   🆕 11. 插入小红书/外部笔记链接（显示为卡片按钮）：           ║
║      在 detail 里用 @@标题|链接@@ 格式                        ║
║      例子：                                                    ║
║        detail: "推荐看这篇攻略\n                               ║
║        @@明治神宫游览攻略|https://www.xiaohongshu.com/...@@"  ║
║      点击后直接跳转到小红书笔记（手机会打开App）              ║
║      也可以插入抖音、B站等任何笔记链接                        ║
║      例子：                                                    ║
║        detail: "明治神宫是东京最著名的神社                     ║
║        !!https://xxx.com/photo.jpg!!                          ║
║        建于1920年，供奉明治天皇和昭宪皇太后"                  ║
║                                                              ║
║   ⚠️ 注意：每个 { } 之间要有英文逗号 ,                        ║
║   ⚠️ 文字要用英文引号 " " 包起来                              ║
║   ⚠️ 文字里面如果本身有引号，换成中文引号「」                   ║
║                                                              ║
╚══════════════════════════════════════════════════════════════╝
*/

const DATA = {

  // ==================== 页面标题 ====================
  title: "東京行程単",
  subtitle: "thatsFrances🍇 の Tokyo Trip",
  dates: "2026.09.24 — 09.27 ✈️ 上海 → 东京",

  // ==================== 每日行程 ====================
  days: [

    {
      date: "9月24日",
      weekday: "星期四 — 到达日 🛬",
      theme: "原宿 · 涩谷 · 新宿",
      emoji: "🌸",
      color: "#E8719E",
      items: [
        {
          time: "01:50",

          title: "上海浦东机场 T2 起飞"
        },
        {
          time: "05:45",

        {

          title: "取行李后， **京急机场线** 急行到 **品川** ，换乘 **JR山手线** 到 **Gotanda Station（五反田駅）**，下车步行约4分钟到{{三井花园饭店五反田|三井ガーデンホテル五反田}}checkin放行李🧳"

        {

          food: "🥐 早餐｜步行2分钟到 {{365 Days|365 Days Yoyogi Hachiman Tokyo}} 买面包 / 步行5分钟到 {{Fuglen Tokyo|Fuglen Tokyo}} 喝咖啡 ☕",

        {

        },
        {
          time: "10:00",

// 地图
function openMap(name, query) {
  if (/^https?:\/\//.test(query)) { window.open(query, '_blank'); return; }
  document.getElementById('mapTitle').textContent = '📍 ' + name;
  let embedSrc, fullLink;
  if (/^-?\d+\.\d+\s*,\s*-?\d+\.\d+$/.test(query.trim())) {
    const c = query.trim();
    embedSrc = 'https://maps.google.com/maps?q=' + c + '&z=16&output=embed&hl=zh-CN';
    fullLink = 'https://www.google.com/maps?q=' + c;
  } else {
    embedSrc = 'https://maps.google.com/maps?q=' + encodeURIComponent(query) + '&output=embed&hl=zh-CN';
    fullLink = 'https://www.google.com/maps/search/' + encodeURIComponent(query);
  }
  document.getElementById('mapFrame').src = embedSrc;
  document.getElementById('mapFullLink').href = fullLink;
  document.getElementById('mapOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeMap() {
  document.getElementById('mapOverlay').classList.remove('open');
  document.getElementById('mapFrame').src = '';
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeMap(); });

// 详情展开/收起
function toggleDetail(btn) {
  btn.classList.toggle('open');
  const box = btn.closest('.tl-card').querySelector('.detail-box');
  if (box) box.classList.toggle('open');
}

// 文本解析
// 解析 @@标题|链接@@ 为小红书卡片
// 小红书弹窗
var _xhsTitle = '';
var _xhsUrl = '';
function openXhs(title, url) {
  _xhsTitle = title;
  _xhsUrl = url;
  // 直接浏览器打开短链接，页面会显示「打开App查看」按钮
  var a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
function closeXhs() { document.getElementById('xhsToast').classList.remove('open'); }
function copyXhs() {
  var text = _xhsTitle + ' ' + _xhsUrl + ' \u3010\u5c0f\u7ea2\u4e66\u3011\u91cc\u6709\u7cbe\u5f69\u5185\u5bb9\uff0c\u5feb\u53bb\u7787\u7787\uff01';
  navigator.clipboard.writeText(text).then(function() {
    document.getElementById('xhsOk').style.display = 'block';
  }).catch(function() {
    var ta = document.createElement('textarea'); ta.value = text;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); document.getElementById('xhsOk').style.display = 'block';
  });
}
function parseCards(t) {
  if(!t) return t;
  return t.replace(/@@(.+?)@@/g, function(_, inner) {
    var sep = inner.lastIndexOf('|');
    if (sep === -1) return inner;
    var title = inner.substring(0, sep);
    var url = inner.substring(sep + 1);
    var src = getLinkSource(url);
    var safeTitle = title.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    var safeUrl = url.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    var action = /xiaohongshu|xhslink/i.test(url)
      ? "openXhs('" + safeTitle + "','" + safeUrl + "')"
      : "window.open('" + safeUrl + "','_blank')";
    return '<div class="xhs-card" onclick="' + action + '">'
      + '<div class="xhs-icon" style="background:linear-gradient(135deg,' + src.color + ',' + src.color + 'cc)">' + src.icon + '</div>'
      + '<div class="xhs-info"><div class="xhs-title">' + title + '</div><div class="xhs-source">' + src.name + ' \u00b7 \u70b9\u51fb\u67e5\u770b</div></div>'
      + '<span class="xhs-arrow">\u203a</span></div>';
  });
}

function md(t){
  if(!t) return '';
  return t
    .replace(/\{\{(.+?)\|(.+?)\}\}/g, function(_, display, loc) {
      const sd = display.replace(/'/g, "\\'").replace(/"/g, '&quot;');
      const sl = loc.replace(/'/g, "\\'").replace(/"/g, '&quot;');
      return '<span class="map-link" onclick="openMap(\'' + sd + '\',\'' + sl + '\')">' + display + '</span>';
    })
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

// 识别链接来源
function getLinkSource(url) {
  if (/xiaohongshu\.com|xhslink\.com/i.test(url)) return {icon:'📕', name:'小红书笔记', color:'#FF4458'};
  if (/douyin\.com/i.test(url)) return {icon:'🎵', name:'抖音', color:'#111'};
  if (/bilibili\.com|b23\.tv/i.test(url)) return {icon:'📺', name:'B站视频', color:'#FB7299'};
  if (/youtube\.com|youtu\.be/i.test(url)) return {icon:'▶️', name:'YouTube', color:'#FF0000'};
  if (/instagram\.com/i.test(url)) return {icon:'📷', name:'Instagram', color:'#E4405F'};
  if (/maps\.app\.goo|google\.com\/maps/i.test(url)) return {icon:'📍', name:'谷歌地图', color:'#4285F4'};
  return {icon:'🔗', name:'查看链接', color:'#666'};
}

// detail 文本解析（支持图片 !!url!!、笔记卡片 @@title|url@@、换行）
function mdDetail(t){
  if(!t) return '';
  return t.split('\n').map(line => {
    line = line.trim();
    if (!line) return '';
    // @@标题|链接@@ → 笔记卡片
    if (/@@(.+?)@@/.test(line)) {
      return line.replace(/@@(.+?)@@/g, function(_, inner) {
        const sep = inner.lastIndexOf('|');
        if (sep === -1) return inner;
        const title = inner.substring(0, sep);
        const url = inner.substring(sep + 1);
        const src = getLinkSource(url);
        return '<a class="xhs-card" href="' + url + '" target="_blank" rel="noopener">'
          + '<div class="xhs-icon" style="background:linear-gradient(135deg,' + src.color + ',' + src.color + 'cc)">' + src.icon + '</div>'
          + '<div class="xhs-info"><div class="xhs-title">' + title + '</div><div class="xhs-source">' + src.name + ' · 点击查看</div></div>'
          + '<span class="xhs-arrow">›</span></a>';
      });
    }
    // !!图片url!! → <img>
    line = line.replace(/!!(.+?)!!/g, '<img src="$1" loading="lazy" alt="">');
    // 复用 md 解析加粗和链接
    line = md(line);
    return '<p>' + line + '</p>';
  }).join('');
}

function render(D){
  const app=document.getElementById('app');
  let h='', detailId=0;
  h+=`<div class="hero"><h1>${D.title||'東京行程単'}</h1><div class="subtitle">${D.subtitle||''}</div><div class="dates">📅 ${D.dates||''}</div></div>`;
  h+=`<div class="container"><div class="checklist"><h2>📋 出发前准备</h2><ul>`;
  (D.checklist||[]).forEach(c=>{h+=`<li onclick="this.classList.toggle('checked')">${md(c)}</li>`});
  h+=`</ul></div></div>`;
  h+=`<div class="day-nav">`;
  D.days.forEach((d,i)=>{h+=`<a href="#day${i+1}" onclick="event.preventDefault();document.getElementById('day${i+1}').scrollIntoView({behavior:'smooth'});document.querySelectorAll('.day-nav a').forEach(x=>x.classList.remove('active'));this.classList.add('active')">${d.emoji||'📍'} Day ${i+1}</a>`});
  h+=`</div><div class="container">`;
  D.days.forEach((day,i)=>{
    const id='day'+(i+1), c=day.color||'#E8719E', cl=c+'18';
    const dn=(day.date||'').match(/(\d+)日/)?.[1]||(i+1);
    h+=`<div id="${id}" class="day-section"><div class="day-header"><div class="day-number" style="background:linear-gradient(135deg,${c},${c}99)"><span class="d">${dn}</span><span class="m">SEP</span></div><div class="day-info"><h2>${day.theme||''}</h2><div class="weekday">${day.weekday||''}</div></div></div><div class="timeline">`;
    (day.items||[]).forEach(it=>{
      h+=`<div class="tl-item"><div class="tl-dot" style="background:${c};border-color:${cl}"></div><div class="tl-card">`;
      if(it.time) h+=`<div class="time-badge" style="background:${cl};color:${c}">${it.icon||'🕐'} ${it.time}</div>`;
      h+=`<div class="act">${md((it.title||'').replace(/\n/g,'<br>'))}`;
      // detail 按钮
      if(it.detail) h+=` <span class="detail-toggle" onclick="toggleDetail(this)"><span class="arrow">▸</span> 详情</span>`;
      h+=`</div>`;
      // detail 内容
      if(it.detail) h+=`<div class="detail-box">${mdDetail(it.detail)}</div>`;
      if(it.spots&&it.spots.length){h+=`<div class="spots">`;it.spots.forEach((s,j)=>{if(j)h+=`<span class="ar">→</span>`;h+=`<span class="s">${s}</span>`});h+=`</div>`}
      // 按数据里的字段顺序渲染 food/note/desert
      var _src=JSON.stringify(it);var _keys=[];
      ['food','note','desert'].forEach(function(k){var idx=_src.indexOf('"'+k+'"');if(idx>-1)_keys.push({k:k,i:idx})});
      _keys.sort(function(a,b){return a.i-b.i});
      // 安全替换 / 为换行：保护链接里的 /
      function safeBr(t){return t.replace(/@@(.+?)@@/g,function(m){return m.replace(/\//g,'\u2215')}).replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,function(m){return m.replace(/\//g,'\u2215')}).replace(/\//g,'<br>').replace(/\u2215/g,'/')}
      _keys.forEach(function(o){
        if(o.k==='food'&&it.food){const p=it.food.split('｜');h+=`<div class="food">${p[0]?'<div class="fl">'+p[0]+'</div>':''}${parseCards(md(safeBr(p[1]||'')))}</div>`}
        if(o.k==='note'&&it.note){h+=`<div class="note">${parseCards(md(safeBr(it.note)))}</div>`}
        if(o.k==='desert'&&it.desert){const p=it.desert.split('｜');h+=`<div class="food">${p[0]?'<div class="fl">'+p[0]+'</div>':''}${parseCards(md(safeBr(p[1]||'')))}</div>`}
      });
      h+=`</div></div>`;
    });
    h+=`</div></div>`;
  });
  h+=`</div><div class="footer"><div class="emoji">🌸🗼🍣</div><p>祝旅途愉快！いってらっしゃい！</p><p style="margin-top:4px;opacity:.6">Tokyo Trip Plan by thatsFrances🍇</p></div>`;
  app.innerHTML=h;
  const nav=document.querySelector('.day-nav'),secs=document.querySelectorAll('.day-section'),links=nav.querySelectorAll('a');
  secs.forEach(s=>new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){links.forEach(x=>x.classList.remove('active'));const l=nav.querySelector(`a[href="#${e.target.id}"]`);if(l)l.classList.add('active')}})},{threshold:.2}).observe(s));
}
render(DATA);
</script>
</body>
</html>
